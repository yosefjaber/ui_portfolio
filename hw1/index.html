<!DOCTYPE html>
<html>
  <link rel="stylesheet" href="css/styles.css">
  <head>
    <meta charset="UTF-8"/>
    <title>Journaling Page</title>
  </head>
  <body>
    <h1>Yosef Jaber's Journaling Page</h1>
    <p>Time and Date</p>
    <img src=pic_of_the_day.png/>
    <p>"Its la peace" - Confucius</p>
    <div>
        <label for="notes">Notes:</label><br>
        <textarea rows="4" cols="50">Your notes here</textarea>
    </div>
    <br>
    <div>
        <label for="sleep">Hours of sleep:</label>
        <input type="text" id="sleep" name="sleep">
    </div>
    <br>
    <h2>How are you feeling today???</h2>
    <label for="energetic"> energetic</label>
    <input type="checkbox" id="energetic"><br>

    <label for="anxious"> anxious</label>
    <input type="checkbox" id="anxious"><br>

    <label for="motivated"> motivated</label>
    <input type="checkbox" id="motivated"><br>

    <label for="happy"> happy</label>
    <input type="checkbox" id="happy"><br>

  </body>
</html>
